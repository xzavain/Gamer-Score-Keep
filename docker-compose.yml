name: gamerscore-keep

services:
  gamerscore-keep:
    build: .
    container_name: gamerscore-keep
    ports:
      - "${PORT:-3000}:3000"
    # Copy .env.example to .env, or set the same vars in Coolify's UI.
    env_file:
      - .env
    environment:
      # App always listens on 3000 inside the container; ${PORT} above
      # controls the host-side port only.
      PORT: 3000
    volumes:
      # SQLite database persists here across restarts/upgrades
      - gsk-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  gsk-data:
